plugins {
    id 'java'
}

apply from: 'gradle/misc.gradle'

group = 'com.tdder.learning.xxxx'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = 'https://manhole.github.io/maven2/release'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaLanguageVersion.of(8)
    targetCompatibility = JavaLanguageVersion.of(8)
}

dependencies {
    modules {
        // hamcrest 2.x 以降は hamcrest-core / hamcrest-library が hamcrest 本体に統合された。
        // junit 4 が 1.3 を推移的に持ち込むので、本体に寄せて重複を防ぐ。
        module('org.hamcrest:hamcrest-core') {
            replacedBy('org.hamcrest:hamcrest', 'hamcrest-core was merged into hamcrest 2.x')
        }
        module('org.hamcrest:hamcrest-library') {
            replacedBy('org.hamcrest:hamcrest', 'hamcrest-library was merged into hamcrest 2.x')
        }
    }

    implementation 'org.slf4j:slf4j-api:2.0.20'

    // logback 1.4 以降は Java 11 必須のため 1.3.x に留める
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.3.16'

    // JUnit 6 は Java 17 必須のため 5.x に留める
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testImplementation 'junit:junit:4.13.2'

    testImplementation 'org.hamcrest:hamcrest:3.0'

    testImplementation 'jp.sourceforge.hotchpotch:coopie:0.5.0'
}

tasks.withType(Test).configureEach {
    // UP-TO-DATEにしない方法
    //dependsOn 'cleanTest'
    useJUnitPlatform()
    testLogging {
        events('passed', 'skipped', 'failed')
    }
    exclude('**/*$*')
}
