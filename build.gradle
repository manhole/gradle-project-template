plugins {
    id 'java'
}

apply from: 'gradle/misc.gradle'
apply from: 'gradle/eclipse.gradle'

group = 'com.tdder.learning.xxxx'
version = '0.0.1-SNAPSHOT'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
    maven {
        url 'https://manhole.github.io/maven2/release'
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.7'

    testRuntimeOnly 'ch.qos.logback:logback-classic:1.3.11'
    testRuntimeOnly 'ch.qos.logback:logback-core:1.3.11'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
    testImplementation 'org.junit.vintage:junit-vintage-engine:5.8.2', {
        exclude group: 'junit', module: 'junit'
    }
    testImplementation 'junit:junit:4.13.2', {
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    }
    testImplementation 'org.hamcrest:hamcrest:2.2'

    testImplementation 'jp.sourceforge.hotchpotch:coopie:0.5.0'
}

test {
    // UP-TO-DATEにしない方法
    //dependsOn 'cleanTest'
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    exclude '**/*$*'
}
